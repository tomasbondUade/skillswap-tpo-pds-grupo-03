name: MySQL integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mysql-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: MySQL persistence tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: skillswap-ci-only
          MYSQL_ROOT_HOST: '%'
        ports:
          - '3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pskillswap-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SKILLSWAP_MYSQL_TEST_USER: root
      SKILLSWAP_MYSQL_TEST_PASSWORD: skillswap-ci-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit and real MySQL integration tests
        env:
          SKILLSWAP_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/?allowPublicKeyRetrieval=true&useSSL=false&connectionTimeZone=UTC
        run: mvn --batch-mode --no-transfer-progress -Pmysql-it clean test
